mytestkey=This value is from LOCAL properties file

merchant.client.id=merchant-id-123



# Enable TRACE logging for Spring Security
logging.level.org.springframework.security=TRACE

validator.rules=CHECK1_VALIDATOR_RULE,DUPLICATION_TXN_RULE,PAYMENT_ATTEMPT_THRESHOLD_RULE

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/validations
spring.datasource.username=root
spring.datasource.password=root

# ========= Eureka Client Configuration =========
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JDBC Connection Pool (Optional Tuning)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.initialization-mode=always

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password= # Leave empty if no password is set
spring.redis.database=0


validation.rule1.param1=Value1
validation.rule1.param2=Value2

validation.rule2.param1=Y
